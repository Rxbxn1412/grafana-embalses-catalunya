[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""

# Entrada: consumir mensajes MQTT del topic rios/embalses
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["rios/embalses"]
  qos = 0
  persistent_session = false
  client_id = "telegraf-rios-v2"
  connection_timeout = "30s"

  data_format = "json"
  tag_keys = ["sensor", "sensor_id", "tipo"]
  json_string_fields = ["timestamp"]
  name_override = "embalses"

# Salida: escribir en InfluxDB
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "rios_db"
  skip_database_creation = true
  username = "root"
  password = "root"
  timeout = "5s"
  write_consistency = "any"